[package]
name = "smugmug_syncer_viewer"
version = "0.1.0"
edition = "2024"
authors = ["Craig Hamilton"]
description = "Desktop (and PWA-ready) viewer for archives created by smugmug_syncer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cch71/smugmug_syncer_viewer"
readme = "README.md"
rust-version = "1.88"
# Distributed as binaries on GitHub releases, never on crates.io
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure Rust zstd decoder, so the archive's *.db files can also be read in the browser (wasm)
ruzstd = "0.9"
anyhow = "1"

# Desktop only
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
parquet = { version = "60", default-features = false, features = ["zstd", "snap"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }
jpeg-decoder = { version = "0.3", optional = true }
kamadak-exif = { version = "0.6", optional = true }
directories = { version = "6", optional = true }
rfd = { version = "0.17", optional = true }

# Web/PWA only
gloo-net = { version = "0.7", default-features = false, features = ["http"], optional = true }
web-sys = { version = "0.3", features = ["Window", "Location", "Url", "UrlSearchParams"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["desktop"]
desktop = [
    "dioxus/desktop",
    "dep:tokio",
    "dep:parquet",
    "dep:image",
    "dep:jpeg-decoder",
    "dep:kamadak-exif",
    "dep:directories",
    "dep:rfd",
]
web = ["dioxus/web", "dep:gloo-net", "dep:web-sys"]

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
