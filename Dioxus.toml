[application]
name = "smugmug_syncer_viewer"
# Default platform for `dx serve` / `dx bundle`.  Use `--platform web` for the PWA build.
default_platform = "desktop"
out_dir = "dist"
asset_dir = "assets"

[web.app]
title = "SmugMug Archive Viewer"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[web.resource]
style = []
script = []

[web.resource.dev]
script = []

[bundle]
identifier = "dev.c13s.smugmug-syncer-viewer"
publisher = "Craig Hamilton"
icon = ["public/icons/icon-512.png", "public/icons/icon.ico"]
short_description = "Browse a smugmug_syncer archive offline"
category = "Photography"
copyright = "Copyright (c) 2026 Craig Hamilton and Contributors"

[bundle.deb]
# Dioxus desktop renders with the system WebKitGTK
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libxdo3"]
