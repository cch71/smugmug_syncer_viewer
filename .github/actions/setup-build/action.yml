name: Set up build
description: >
  Installs the Rust toolchain and, on Linux, the WebKitGTK/GTK libraries Dioxus desktop links
  against.  Shared by the CI and release workflows.
inputs:
  components:
    description: Extra rustup components (comma separated)
    required: false
    default: ""
  targets:
    description: Extra rustup targets (comma separated)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev pkg-config

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
