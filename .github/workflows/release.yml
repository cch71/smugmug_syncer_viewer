name: Release

# Runs when a version tag is pushed, e.g. by `cargo release patch --execute` (see release.toml),
# or when a tag is created from the GitHub "Draft a new release" page.  Builds installers for
# Windows, Linux and macOS and attaches them to the GitHub release for the tag.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for, e.g. v0.1.0
        required: true
      platforms:
        description: >-
          Platforms to build, comma separated (windows-x86_64, linux-x86_64, macos-aarch64,
          macos-x86_64).  Empty builds all of them.
        required: false
        default: ""
      reuse-packages-from-run:
        description: >-
          ID of an earlier Release run for the same tag whose packages should be attached too,
          e.g. to rebuild only the platform that failed.  Empty attaches only this run's.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.10
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  plan:
    name: Choose platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORMS: ${{ github.event.inputs.platforms }}
          REUSE_RUN: ${{ github.event.inputs.reuse-packages-from-run }}
        run: |
          # linux-x86_64 is pinned to the oldest Ubuntu we support: the .deb and .AppImage need a
          # glibc at least as new as the build machine's (2.39 on 24.04).  Don't use
          # ubuntu-latest, which would silently raise that minimum.
          all='[
            {"name": "windows-x86_64", "os": "windows-latest",
             "packages": "--package-types msi --package-types nsis"},
            {"name": "linux-x86_64", "os": "ubuntu-24.04",
             "packages": "--package-types deb", "appimage": true},
            {"name": "macos-aarch64", "os": "macos-latest",
             "packages": "--package-types macos --package-types dmg"},
            {"name": "macos-x86_64", "os": "macos-15-intel",
             "packages": "--package-types macos --package-types dmg"}
          ]'
          if [[ -n "$REUSE_RUN" && ! "$REUSE_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::reuse-packages-from-run must be a numeric run ID"
            exit 1
          fi
          wanted=$(jq -cn --arg p "$PLATFORMS" '$p | gsub("\\s"; "") | split(",") | map(select(. != ""))')
          unknown=$(jq -cn --argjson all "$all" --argjson w "$wanted" '$w - ($all | map(.name))')
          if [ "$unknown" != "[]" ]; then
            echo "::error::Unknown platforms: $unknown"
            exit 1
          fi
          matrix=$(jq -cn --argjson all "$all" --argjson w "$wanted" \
            '{include: [$all[] | select(($w | length) == 0 or (.name | IN($w[])))]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq . <<< "$matrix"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check the tag matches the Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match Cargo.toml version $version"
            exit 1
          fi

      # No build cache here: release builds start clean so a poisoned cache can't reach them
      - uses: ./.github/actions/setup-build

      # The prebuilt Linux dx needs glibc 2.39+, so the Linux runner must be Ubuntu 24.04 or newer
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: Bundle
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          # shellcheck disable=SC2086 # PACKAGES holds several flags
          dx bundle --release --platform desktop $PACKAGES --out-dir dist

      - name: Bundle AppImage
        if: matrix.appimage
        # The AppImage is a convenience; the .deb is the supported Linux package
        continue-on-error: true
        shell: bash
        run: |
          # libfuse2 was renamed libfuse2t64 in Ubuntu 24.04
          sudo apt-get install -y --no-install-recommends libfuse2t64 file
          dx bundle --release --platform desktop --package-types appimage --out-dir dist

      - name: Collect packages
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          mkdir upload
          for item in dist/*; do
            case "$item" in
              *.app)
                # .app bundles are directories; zip them keeping permissions and symlinks
                ditto -c -k --keepParent "$item" "upload/$(basename "$item" .app)_${TAG#v}_${NAME}.app.zip"
                ;;
              *.msi | *.exe | *.deb | *.AppImage | *.dmg | *.rpm)
                cp "$item" upload/
                ;;
            esac
          done
          ls -l upload
          test -n "$(ls upload)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.name }}
          path: upload/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only used to download packages from an earlier run (reuse-packages-from-run)
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Download packages from an earlier run
        if: github.event.inputs.reuse-packages-from-run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
          run-id: ${{ github.event.inputs.reuse-packages-from-run }}
          github-token: ${{ github.token }}

      # Downloaded second, so packages rebuilt by this run replace the earlier run's
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Check every package is for this version
        run: |
          version="${TAG#v}"
          ls -l packages
          for file in packages/*; do
            if [[ "$(basename "$file")" != *"_${version}_"* ]]; then
              echo "::error::$file isn't a $version package"
              exit 1
            fi
          done

      - name: Checksums
        working-directory: packages
        run: sha256sum -- * | tee SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          # The section for this version, up to the next version heading or link list
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "See the [user manual](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/USER_MANUAL.md) for installation instructions."
          } >> notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release drafted on github.com for this tag is kept and gets the packages added
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=()
            # Tags like v1.2.0-rc.1 are pre-releases
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file notes.md --generate-notes "${flags[@]}"
          fi
          gh release upload "$TAG" packages/* --clobber
